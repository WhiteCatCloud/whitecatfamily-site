name: CI
on:
  pull_request:
    branches: [main, canary]
  push:
    branches: [main, canary]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Promotion path:
      #   Phase 2 → markers PHASE=2 enforced (footer markers everywhere)
      #   Phase 3 → forbidden strings enforced (no $79/Reserve Yours anywhere)
      #   Phase 5 → permanent URLs enforced (/doc, /guide exist EN+DE)
      #   Phase 6 → markers PHASE=6 enforced (cookie markers everywhere)
      #   Phase 8 → markers PHASE=8 enforced (locale-switch + hreflang)
      - name: Forbidden strings (enforced — Phase 3)
        run: npm run check:forbidden
      - name: Markers present (enforced — Phase 8 / full set)
        env: { MARKER_PHASE: '8' }
        run: npm run check:markers
      - name: Permanent URLs (enforced — Phase 5)
        run: npm run check:permanent
