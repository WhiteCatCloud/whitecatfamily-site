name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      # Advisory until the relevant phase lands; flip `continue-on-error: false`
      # after Phase 3 (forbidden) and Phase 6 (markers) and Phase 5.7 (permanent) merge to main.
      - name: Forbidden strings (advisory until Phase 3)
        run: npm run check:forbidden
        continue-on-error: true
      - name: Markers present (advisory until Phase 2)
        # Phase escalates: 2 (footer only) → 6 (+cookie) → 8 (+locale-switch +hreflang)
        env: { MARKER_PHASE: '2' }
        run: npm run check:markers
        continue-on-error: true
      - name: Permanent URLs (advisory until Phase 5)
        run: npm run check:permanent
        continue-on-error: true
