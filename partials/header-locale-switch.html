<nav class="wc-locale-switch d-flex align-items-center gap-2" aria-label="Language" style="font-size:0.85rem;">
  <a href="{{US_URL}}" data-locale="en-US" rel="alternate" class="text-muted text-decoration-none" title="USA / English">🇺🇸</a>
  <span class="text-muted" aria-hidden="true">·</span>
  <a href="{{EN_URL}}" data-locale="en-EU" rel="alternate" hreflang="en" class="text-muted text-decoration-none" title="EU / English">🇪🇺 EN</a>
  <span class="text-muted" aria-hidden="true">·</span>
  <a href="{{DE_URL}}" data-locale="de" rel="alternate" hreflang="de" class="text-muted text-decoration-none" title="Deutsch">🇩🇪 DE</a>
  <span class="text-muted" aria-hidden="true">·</span>
  <a href="{{FR_URL}}" data-locale="fr" rel="alternate" hreflang="fr" class="text-muted text-decoration-none" title="Français">🇫🇷 FR</a>
  <span class="text-muted" aria-hidden="true">·</span>
  <a href="{{SK_URL}}" data-locale="sk" rel="alternate" hreflang="sk" class="text-muted text-decoration-none" title="Slovenčina">🇸🇰 SK</a>
</nav>
<script>
(function () {
  document.querySelectorAll('.wc-locale-switch a').forEach(function (a) {
    a.addEventListener('click', function () {
      var locale = a.dataset.locale || 'en-US';
      document.cookie = 'wc_locale=' + locale + '; max-age=' + (365 * 24 * 3600) + '; path=/; samesite=lax';
    });
  });
})();
</script>
