<li class="wc-locale-item">
  <select class="wc-locale-select" aria-label="Language">
    <option value="en-US" data-href="{{US_URL}}">🇺🇸 English (US)</option>
    <option value="en-EU" data-href="{{EN_URL}}">🇪🇺 English (EU)</option>
    <option value="de"    data-href="{{DE_URL}}">🇩🇪 Deutsch</option>
    <option value="fr"    data-href="{{FR_URL}}">🇫🇷 Français</option>
    <option value="sk"    data-href="{{SK_URL}}">🇸🇰 Slovenčina</option>
  </select>
</li>
<style>
.wc-locale-item {
  list-style: none;
  display: inline-flex;
  align-items: center;
  margin-left: 0.75rem;
}
.wc-locale-select {
  appearance: auto;
  font-size: 0.85rem;
  padding: 0.25rem 0.55rem;
  border: 1px solid rgba(0, 0, 0, 0.15);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.9);
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  max-width: 180px;
}
.wc-locale-select:hover { border-color: rgba(0, 0, 0, 0.35); }
.wc-locale-select:focus { outline: 2px solid #5d57f4; outline-offset: 1px; }
</style>
<script>
(function () {
  var sel = document.querySelector('.wc-locale-select');
  if (!sel) return;
  var current = document.documentElement.dataset.locale || 'en-US';
  sel.value = current;
  sel.addEventListener('change', function () {
    var opt = sel.options[sel.selectedIndex];
    var href = opt.dataset.href;
    document.cookie =
      'wc_locale=' + sel.value + '; max-age=' + (365 * 24 * 3600) + '; path=/; samesite=lax';
    if (href) window.location.href = href;
  });
})();
</script>
